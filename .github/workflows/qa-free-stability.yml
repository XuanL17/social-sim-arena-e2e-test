name: Isolated free-model stability
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
concurrency:
  group: isolated-free-stability
  cancel-in-progress: false
jobs:
  probe:
    outputs:
      enabled: ${{ steps.window.outputs.enabled }}
    if: github.repository == 'assassin808/social-sim-arena-e2e-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bounded observation period
        id: window
        run: |
          if [ "$(date -u +%Y-%m-%d)" \> '2026-09-30' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.window.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.window.outputs.enabled == 'true'
        run: pip install requests cryptography
      - name: Four fresh free-model probes and cached repeats
        if: steps.window.outputs.enabled == 'true'
        run: python tools/qa_free_stability.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.enabled == 'true'
        with:
          name: free-stability-${{ github.run_id }}
          path: qa-stability/
          retention-days: 30

  publish:
    needs: probe
    if: always() && needs.probe.result != 'cancelled' && needs.probe.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    concurrency:
      group: isolated-qa-results-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: free-stability-${{ github.run_id }}
          path: qa-stability/
      - name: Publish allowlisted report to qa-results only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_qa_results.py stability
